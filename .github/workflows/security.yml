name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned gitleaks release. Bump GITLEAKS_VERSION and GITLEAKS_SHA256 together,
  # in lockstep with the local install. The SHA is the linux x64 tarball digest
  # from the release's checksums.txt; pinning it here (rather than trusting a
  # checksums file from the same release) makes the trusted artifact auditable
  # in the diff and guards against a tampered release, not just transport errors.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "${base}/${archive}" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks
          gitleaks version
      - name: Scan pull request commit range
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan full history
        if: github.event_name == 'push'
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - name: Summarize moderate and low advisories
        run: npm audit --audit-level=moderate || true
      # Advisories with no patched release yet, judged unreachable in production.
      # Remove each entry once upstream ships a fix.
      # - GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 DoS on deeply nested globs; only
      #   build tooling (nuxt > nitropack > globby) feeds it trusted patterns.
      # - GHSA-86w9-cpqp-85rv: node-forge <=1.4.0 RSA signature parsing; only
      #   reached via @dotenvx/dotenvx and listhen (dev-server certs).
      - name: Fail on high or critical advisories
        env:
          AUDIT_ALLOWLIST: >-
            GHSA-vfj7-8cjw-p6xm
            GHSA-86w9-cpqp-85rv
        run: |
          # npm audit exits nonzero whenever it finds anything; jq decides pass/fail.
          audit_json=$(npm audit --json || true)
          unallowed=$(echo "$audit_json" | jq -r --arg allow "$AUDIT_ALLOWLIST" '
            ($allow | split(" ")) as $allowed
            | [.vulnerabilities[].via[] | objects
                | select(.severity == "high" or .severity == "critical")
                | .url | select((split("/") | last) as $id | $allowed | index($id) | not)]
            | unique | .[]')
          if [ -n "$unallowed" ]; then
            echo "High or critical advisories not in AUDIT_ALLOWLIST:"
            echo "$unallowed"
            exit 1
          fi
